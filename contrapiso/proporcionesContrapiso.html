<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>Configurar Proporciones - c.Calc</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="js/guard.js"></script>
    <script type="module" src="js/app.js"></script>
</head>

<body class="bg-zinc-900 text-slate-100 font-sans min-h-screen">
    <div id="navbar"></div>

    <main class="min-h-[calc(100vh-72px)] flex items-center justify-center px-4 py-8 sm:py-12">
        <div class="w-full max-w-xl">

            <div class="relative overflow-hidden rounded-3xl border border-zinc-800 bg-zinc-950/60 p-6 sm:p-10 shadow-2xl backdrop-blur-sm">

                <!-- Luces ambientales -->
                <div class="absolute -top-24 -right-24 w-72 h-72 rounded-full bg-sky-500/10 blur-3xl pointer-events-none"></div>
                <div class="absolute -bottom-32 -left-24 w-80 h-80 rounded-full bg-slate-500/10 blur-3xl pointer-events-none"></div>

                <div class="relative space-y-6">

                    <!-- Encabezado -->
                    <header class="text-center sm:text-left">
                        <p class="text-sky-400 text-xs font-medium tracking-[0.25em] uppercase mb-1">
                            Contrapiso
                        </p>
                        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">
                            Configurar <span class="text-sky-400">Proporciones</span>
                        </h1>
                        <div class="w-12 h-1 bg-sky-500 rounded-full mt-3 mx-auto sm:mx-0"></div>
                    </header>

                    <!-- Proporciones actuales -->
                    <div class="bg-zinc-900/60 p-5 rounded-2xl border border-zinc-800/80 space-y-3">
                        <h2 class="text-xs font-semibold text-sky-400 uppercase tracking-wider flex items-center gap-2">
                            <span class="w-1.5 h-1.5 rounded-full bg-sky-400"></span>
                            Proporciones actuales
                        </h2>

                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                            <div class="flex items-center justify-between rounded-xl bg-zinc-900 border border-zinc-800 px-3.5 py-2.5">
                                <span class="text-xs text-zinc-300">Arena</span>
                                <span id="arenaDato" class="rounded-lg bg-sky-500/10 border border-sky-500/20 px-2.5 py-0.5 text-xs font-semibold text-sky-400"></span>
                            </div>

                            <div class="flex items-center justify-between rounded-xl bg-zinc-900 border border-zinc-800 px-3.5 py-2.5">
                                <span class="text-xs text-zinc-300">Ripio</span>
                                <span id="ripioDato" class="rounded-lg bg-sky-500/10 border border-sky-500/20 px-2.5 py-0.5 text-xs font-semibold text-sky-400"></span>
                            </div>

                            <div class="flex items-center justify-between rounded-xl bg-zinc-900 border border-zinc-800 px-3.5 py-2.5">
                                <span class="text-xs text-zinc-300">Cemento</span>
                                <span id="cementoDato" class="rounded-lg bg-sky-500/10 border border-sky-500/20 px-2.5 py-0.5 text-xs font-semibold text-sky-400"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Formulario de proporciones -->
                    <div id="form_proporciones" class="bg-zinc-900/60 p-5 rounded-2xl border border-zinc-800/80 space-y-4">
                        <div>
                            <h2 class="text-xs font-semibold text-sky-400 uppercase tracking-wider flex items-center gap-2">
                                <span class="w-1.5 h-1.5 rounded-full bg-sky-400"></span>
                                Nuevas proporciones de mezcla
                            </h2>
                            <p class="text-xs text-zinc-400 mt-1">
                                Las proporciones estándar son 4 baldes de arena, 4 de ripio y 2 de cemento.
                            </p>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
                            <div>
                                <label for="arena" class="block text-xs font-medium text-zinc-400 mb-1.5">Arena (baldes)</label>
                                <input type="number" id="arena" placeholder="4"
                                    class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-white placeholder-zinc-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition text-sm">
                            </div>

                            <div>
                                <label for="ripio" class="block text-xs font-medium text-zinc-400 mb-1.5">Ripio (baldes)</label>
                                <input type="number" id="ripio" placeholder="4"
                                    class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-white placeholder-zinc-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition text-sm">
                            </div>

                            <div>
                                <label for="cemento" class="block text-xs font-medium text-zinc-400 mb-1.5">Cemento (baldes)</label>
                                <input type="number" id="cemento" placeholder="2"
                                    class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-white placeholder-zinc-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition text-sm">
                            </div>
                        </div>

                        <button onclick="C_ajustarProporciones()"
                            class="w-full bg-sky-500 hover:bg-sky-400 text-zinc-950 font-semibold py-3.5 rounded-xl transition duration-200 shadow-lg shadow-sky-500/20 cursor-pointer text-sm sm:text-base mt-2">
                            Guardar Nuevas Proporciones
                        </button>
                    </div>

                    <div class="text-center pt-2">
                        <a href="contrapiso.html"
                            class="inline-flex items-center gap-2 text-sm text-zinc-400 hover:text-sky-400 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                            </svg>
                            <span>Volver a la calculadora de Contrapiso</span>
                        </a>
                    </div>

                </div>
            </div>

            <div class="text-center mt-6">
                <p class="text-xs text-zinc-600">
                    c.Calc · Medir · Calcular · Planificar
                </p>
            </div>

        </div>
    </main>

    <script src="logica.js"></script>
    <script type="module" src="/js/navbar.js"></script>
</body>

</html>
