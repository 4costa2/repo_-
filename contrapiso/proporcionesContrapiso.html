<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="Cache-Control" content="no-store" />
        <title>Configurar Proporciones</title>

        <script src="https://cdn.tailwindcss.com"></script>
        <script type="module" src="js/guard.js"></script>
        <script type="module" src="js/app.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>

    <body>
        <div id="navbar"></div>
        <div
            class="bg-zinc-900 text-slate-100 font-sans min-h-screen py-10 px-4 sm:px-8 flex flex-col items-center"
        >
            <div
                class="w-full max-w-xl bg-zinc-800/80 backdrop-blur-sm border border-zinc-700 rounded-2xl shadow-xl p-6 sm:p-8 space-y-6"
            >
                <div
                    class="rounded-2xl border border-zinc-700 bg-zinc-900 p-4 shadow-lg"
                >
                    <h2 class="mb-3 text-base font-semibold text-white">
                        Proporciones actuales
                    </h2>

                    <div class="grid grid-cols-3 gap-2">
                        <div
                            class="flex items-center justify-between rounded-lg bg-zinc-700/70 px-3 py-2"
                        >
                            <span class="text-xs text-white"
                                >Baldes de arena</span
                            >
                            <span
                                id="arenaDato"
                                class="rounded-md bg-cyan-900/80 px-2 py-0.5 text-xs font-semibold text-cyan-300"
                            ></span>
                        </div>

                        <div
                            class="flex items-center justify-between rounded-lg bg-zinc-700/70 px-3 py-2"
                        >
                            <span class="text-xs text-white"
                                >Baldes de ripio</span
                            >
                            <span
                                id="ripioDato"
                                class="rounded-md bg-cyan-900/80 px-2 py-0.5 text-xs font-semibold text-cyan-300"
                            ></span>
                        </div>

                        <div
                            class="flex items-center justify-between rounded-lg bg-zinc-700/70 px-3 py-2"
                        >
                            <span class="text-xs text-white"
                                >Baldes de cemento</span
                            >
                            <span
                                id="cementoDato"
                                class="rounded-md bg-cyan-900/80 px-2 py-0.5 text-xs font-semibold text-cyan-300"
                            ></span>
                        </div>
                    </div>
                </div>

                <div
                    id="form_proporciones"
                    class="flex flex-col bg-zinc-900/50 p-4 rounded-xl border border-zinc-700/60 space-y-3 items-center justify-center transition-all duration-500"
                >
                    <h3
                        class="text-sm font-semibold text-indigo-400 uppercase tracking-wider"
                    >
                        Configurar proporciones
                    </h3>

                    <h5 class="text-xs text-gray-400 text-center">
                        Las proporciones por defecto son arena 4 baldes, ripio 4
                        baldes y cemento 2 baldes
                    </h5>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 w-full">
                        <div>
                            <label class="block text-xs text-zinc-400 mb-1"
                                >arena</label
                            >
                            <input
                                type="number"
                                id="arena"
                                placeholder="4"
                                class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            />
                        </div>

                        <div>
                            <label class="block text-xs text-zinc-400 mb-1"
                                >ripio</label
                            >
                            <input
                                type="number"
                                id="ripio"
                                placeholder="4"
                                class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            />
                        </div>

                        <div>
                            <label class="block text-xs text-zinc-400 mb-1"
                                >cemento</label
                            >
                            <input
                                type="number"
                                id="cemento"
                                placeholder="2"
                                class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            />
                        </div>
                    </div>

                    <button
                        onclick="C_ajustarProporciones()"
                        class="w-full sm:w-80 bg-cyan-600 hover:bg-cyan-800 text-white font-medium py-3 rounded-xl transition-all shadow-lg cursor-pointer mt-2"
                    >
                        Cambiar Proporciones
                    </button>

                    <a
                        href="contrapiso.html"
                        class="text-sm text-zinc-400 hover:text-white mt-4 transition-colors"
                    >
                        Volver a la calculadora de Contrapiso
                    </a>
                </div>
            </div>
        </div>

        <script src="logica.js"></script>
        <script type="module" src="/js/navbar.js"></script>
    </body>
</html>
