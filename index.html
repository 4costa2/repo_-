<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>c.Calc</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-zinc-900 text-slate-100 font-sans min-h-screen flex items-center justify-center px-4 py-10">

    <main class="w-full max-w-xl">
        <div class="relative overflow-hidden rounded-3xl border border-zinc-800 bg-zinc-950/60 px-6 py-12 sm:px-10 sm:py-14 shadow-2xl text-center backdrop-blur-sm">

            <!-- Luces ambientales -->
            <div class="absolute -top-24 -right-24 w-72 h-72 rounded-full bg-sky-500/10 blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-32 -left-24 w-80 h-80 rounded-full bg-slate-500/10 blur-3xl pointer-events-none"></div>

            <div class="relative">
                <p class="text-sky-400 text-xs sm:text-sm font-medium tracking-[0.25em] uppercase mb-4">
                    Herramienta de cálculo
                </p>

                <h1 class="text-4xl sm:text-5xl font-bold tracking-tight text-white mb-6">
                    Bienvenido a <span class="text-sky-400">c.Calc</span>
                </h1>

                <div class="w-14 h-1 bg-sky-500 rounded-full mx-auto mb-7"></div>

                <p class="text-base sm:text-lg text-zinc-300 leading-relaxed mb-8">
                    Para poder usar las calculadoras de materiales y estimar tus proyectos, inicia sesión con tu cuenta.
                </p>

                <div class="flex flex-col sm:flex-row items-center justify-center gap-3 mb-8">
                    <a href="login.html"
                        class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-sky-500 hover:bg-sky-400 text-zinc-950 font-semibold py-3 px-8 rounded-xl transition duration-200 shadow-lg shadow-sky-500/20 text-sm sm:text-base">
                        Iniciar sesión
                    </a>
                    <a href="registro.html"
                        class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 font-medium py-3 px-8 rounded-xl transition duration-200 text-sm sm:text-base">
                        Crear cuenta
                    </a>
                </div>

                <div class="flex items-center justify-center gap-3">
                    <span class="w-10 h-px bg-zinc-800"></span>
                    <span class="text-zinc-600 text-xs uppercase tracking-widest">
                        Medir · Calcular · Planificar
                    </span>
                    <span class="w-10 h-px bg-zinc-800"></span>
                </div>
            </div>
        </div>

        <div class="text-center mt-6">
            <p class="text-sm text-zinc-600">
                Una forma simple de transformar las medidas de un proyecto en estimaciones útiles.
            </p>
        </div>
    </main>

</body>

</html>
