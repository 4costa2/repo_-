<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-zinc-900 text-slate-100 flex items-center justify-center h-screen">

    <div class="bg-zinc-800  p-6 rounded-xl shadow-md border border-white">
        <h1 class="text-2xl font-bold mb-4">Registrarse</h1>
        <input id="email" class="border p-2 rounded w-full mb-3" placeholder="Ingrese su correo" type="email" required>
        <input id="password" type="password" class="border p-2 rounded w-full mb-3" placeholder="Ingrese su contraseña"
            required>
        <input id="confirmPassword" type="password" class="border p-2 rounded w-full mb-3"
            placeholder="Confirmar contraseña" required>

        <button id="btnRegister"
            class="w-full bg-slate-600 hover:bg-slate-700 text-white p-2 rounded transition-colors">
            Registrarse
        </button>
    </div>

    <script type="module">
        import { registro } from "./js/auth.js";

        const btnRegister = document.getElementById("btnRegister");

        btnRegister.addEventListener("click", async () => {

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                alert("Las contraseñas no coinciden");
                return;
            }

            try {

                await registro(email, password);

                alert("Usuario registrado correctamente");

                location.href = "login.html";

            } catch (error) {

                alert(error.message);

            }

        });
    </script>
</body>

</html>
