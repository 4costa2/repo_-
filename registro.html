<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - c.Calc</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-zinc-900 text-slate-100 font-sans min-h-screen flex items-center justify-center px-4 py-10">

    <div class="w-full max-w-md">
        <div class="relative overflow-hidden rounded-3xl border border-zinc-800 bg-zinc-950/60 p-8 sm:p-10 shadow-2xl backdrop-blur-sm">

            <!-- Luces ambientales -->
            <div class="absolute -top-24 -right-24 w-72 h-72 rounded-full bg-sky-500/10 blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-32 -left-24 w-80 h-80 rounded-full bg-slate-500/10 blur-3xl pointer-events-none"></div>

            <div class="relative">
                <div class="text-center mb-6">
                    <p class="text-sky-400 text-xs font-medium tracking-[0.25em] uppercase mb-2">
                        c.<span class="text-sky-400">Calc</span>
                    </p>
                    <h1 class="text-3xl font-bold tracking-tight text-white">
                        Crear Cuenta
                    </h1>
                    <div class="w-12 h-1 bg-sky-500 rounded-full mx-auto mt-3"></div>
                </div>

                <div class="space-y-4">
                    <!-- Username -->
                    <div>
                        <label for="username" class="block text-xs font-medium text-zinc-400 mb-1.5">Usuario</label>
                        <input
                            id="username"
                            class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2.5 text-white placeholder-zinc-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition text-sm"
                            placeholder="Ingrese su usuario"
                            type="text"
                            required
                        >
                    </div>

                    <!-- Email -->
                    <div>
                        <label for="email" class="block text-xs font-medium text-zinc-400 mb-1.5">Correo electrónico</label>
                        <input
                            id="email"
                            class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2.5 text-white placeholder-zinc-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition text-sm"
                            placeholder="correo@ejemplo.com"
                            type="email"
                            required
                        >
                    </div>

                    <!-- Contraseña -->
                    <div>
                        <label for="password" class="block text-xs font-medium text-zinc-400 mb-1.5">Contraseña</label>
                        <input
                            id="password"
                            type="password"
                            class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2.5 text-white placeholder-zinc-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition text-sm"
                            placeholder="••••••••"
                            required
                        >
                    </div>

                    <!-- Confirmar contraseña -->
                    <div>
                        <label for="confirmPassword" class="block text-xs font-medium text-zinc-400 mb-1.5">Confirmar contraseña</label>
                        <input
                            id="confirmPassword"
                            type="password"
                            class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2.5 text-white placeholder-zinc-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition text-sm"
                            placeholder="••••••••"
                            required
                        >
                    </div>

                    <button
                        id="btnRegister"
                        class="w-full bg-sky-500 hover:bg-sky-400 text-zinc-950 font-semibold py-3 rounded-xl transition duration-200 shadow-lg shadow-sky-500/20 cursor-pointer text-sm mt-2"
                    >
                        Registrarse
                    </button>
                </div>

                <p class="text-xs sm:text-sm text-zinc-400 text-center mt-6">
                    ¿Ya tienes una cuenta?
                    <a href="login.html" class="text-sky-400 hover:text-sky-300 font-medium hover:underline ml-1">
                        Inicia sesión aquí
                    </a>
                </p>

            </div>
        </div>

        <div class="text-center mt-6">
            <p class="text-xs text-zinc-600">
                c.Calc · Medir · Calcular · Planificar
            </p>
        </div>
    </div>

    <script type="module">

        import { registro } from "./js/auth.js";

        const btnRegister = document.getElementById("btnRegister");

        btnRegister.addEventListener("click", async () => {

            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (!username || !email || !password || !confirmPassword) {
                alert("Completá todos los campos");
                return;
            }

            if (password !== confirmPassword) {
                alert("Las contraseñas no coinciden");
                return;
            }

            try {

                await registro(
                    username,
                    email,
                    password
                );

                alert("Usuario registrado correctamente");

                location.href = "login.html";

            } catch (error) {

                alert(error.message);

            }

        });

    </script>

</body>

</html>
