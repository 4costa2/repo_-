<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-zinc-900 text-slate-100 flex items-center justify-center h-screen">

    <div class="bg-zinc-800 p-6 rounded-xl shadow-md border border-white">
        <h1 class="text-2xl font-bold mb-4">Iniciar Sesión</h1>
        <p class="text-sm mb-4 text-end">¿No tienes una cuenta? <a href="registro.html"
                class="text-sky-500 hover:underline">Registrate aqui</a></p>
        <input id="email" class="border p-2 rounded w-full mb-3 text-slate-900" placeholder="Ingrese su correo" type="email">
        <input id="password" class="border p-2 rounded w-full mb-3 text-slate-900" placeholder="Ingrese su contraseña" type="password">


        <button class="w-full bg-slate-600 hover:bg-slate-700 text-white p-2 rounded transition-colors" id="btnLogin">
            Ingresar
        </button>
    </div>
    <script type="module">


        import { login } from "./js/auth.js";

        btnLogin.onclick = async () => {

            try {

                await login(
                    email.value,
                    password.value
                );

                location.href = "home.html";

            } catch (e) {

                alert(e.message);

            }

        }

    </script>
</body>

</html>
