<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Presupuesto contrapiso</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="js/guard.js"></script>
  <script type="module" src="js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
</head>

<body>
  <div id="navbar"></div>
  <div class="bg-zinc-900 text-slate-100 font-sans min-h-screen py-10 px-4 sm:px-8 flex flex-col items-center">
    <div
      class="w-full max-w-xl bg-zinc-800/80 backdrop-blur-sm border border-zinc-700 rounded-2xl shadow-xl p-6 sm:p-8 space-y-6">

      <header class="text-center space-y-2">
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
          <span>Presupuesto contrapiso</span>
        </h1>
        <p class="text-xs text-zinc-400">Calcula materiales, costos y proporciones fácilmente</p>
      </header>

      <!-- Botones de navegación (Se quitó el botón innecesario del rectángulo) -->
      <div class="flex flex-wrap gap-3 justify-center pt-2">
        <button onclick="mostrarProporciones()"
          class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-xl transition-all shadow-md cursor-pointer flex items-center gap-2 text-sm">
          Proporciones Materiales ⚙️
        </button>
        <button onclick="reinicio()"
          class="bg-zinc-700 hover:bg-zinc-600 text-zinc-200 font-medium px-4 py-2 rounded-xl transition-all shadow-md cursor-pointer text-sm">
          Reiniciar
        </button>
      </div>

      <!-- interfaz_rectángulo (Siempre desplegado por defecto) -->
      <div id="form_rectangulo" class="formulario block space-y-6">
        <form onsubmit="calculo_contrapiso(); return false" class="space-y-4">

          <div class="bg-zinc-900/50 p-4 rounded-xl border border-zinc-700/60 space-y-3">
            <h3 class="text-sm font-semibold text-indigo-400 uppercase tracking-wider">Calculo contrapiso de forma
              Cuadrada o Rectángular</h3>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              
              <div>
              <label class="block text-xs text-zinc-400 mb-1">Tamaño balde (kg)</label>
                <input type="number" id="tamanoBalde step="any" required placeholder="8 kg"
                  class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </div>
              <div>
              <label class="block text-xs text-zinc-400 mb-1">Tamaño bolsa de cemento (kg)</label>
                <input type="number" id="tamanoBolsa step="any" required placeholder="25 kg"
                  class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </div>
              <div>
                <label class="block text-xs text-zinc-400 mb-1">Largo (m)</label>
                <input type="number" id="largo" step="any" required placeholder="2 mts"
                  class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </div>
              <div>
                <label class="block text-xs text-zinc-400 mb-1">Ancho (m)</label>
                <input type="number" id="ancho" step="any" required placeholder="2 mts"
                  class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </div>
              <div>
                <label class="block text-xs text-zinc-400 mb-1">Profundidad (cm)</label>
                <input type="number" id="altura" step="any" required placeholder="10 cm"
                  class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </div>
            </div>
          </div>

          <div class="bg-zinc-900/50 p-4 rounded-xl border border-zinc-700/60 space-y-3">
            <h3 class="text-sm font-semibold text-indigo-400 uppercase tracking-wider">Costo de los materiales
              (opcionales)</h3>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div>
                <label class="block text-xs text-zinc-400 mb-1">Precio m³ arena</label>
                <input type="number" id="precio_arena" step="any" placeholder=" $ 1000 "
                  class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </div>
              <div>
                <label class="block text-xs text-zinc-400 mb-1">Precio m³ ripio</label>
                <input type="number" id="precio_ripio" step="any" placeholder=" $ 1000 "
                  class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </div>
              <div>
                <label class="block text-xs text-zinc-400 mb-1">Precio bolsa cemento</label>
                <input type="number" id="precio_cemento" step="any" placeholder=" $ 1000 "
                  class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </div>
            </div>
          </div>

          <button type="submit"
            class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl transition-all shadow-lg cursor-pointer">
            Calcular Presupuesto
          </button>
        </form>

       

      <!-- formulario proporciones materiales (Oculto por defecto, se despliega con el botón) -->
      <div id="form_proporciones"
        class="formulario max-h-0 overflow-hidden opacity-0 transition-all duration-500 ease-in-out space-y-4 bg-zinc-900/50 p-4 rounded-xl border border-zinc-700/60">
        <div>
          <label class="block text-xs text-zinc-400 mb-1">Presupuesto inicial</label>
          <input type="number" id="Presupuesto_2" placeholder="(opcional)"
            class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <h3 class="text-sm font-semibold text-indigo-400 uppercase tracking-wider pt-2">Proporción de mezcla (baldes de 8 litros) (modificable)</h3>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs text-zinc-400 mb-1">Arena</label>
            <!-- correcion de inputs value => placeholder -->
            <input type="number" id="prop_arena" placeholder="4" 
              class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"> 
          </div> 
          <div>
            <label class="block text-xs text-zinc-400 mb-1">Ripio</label>
            <input type="number" id="prop_ripio" placeholder="4"
              class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1">Cemento</label>
            <input type="number" id="prop_cemento" placeholder="2"
              class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>
      </div>


       <div id="resultado_1"
          class="mt-4 empty:hidden bg-zinc-900/80 border border-zinc-700 p-4 rounded-xl space-y-1 text-sm"></div>
      </div>

    </div>                                                                                                                                                                        
  </div>
  <script src="logica.js">
   
  </script>
  <script type="module" src="js/navbar.js"></script>
</body>

</html>
