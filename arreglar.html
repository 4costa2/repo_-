<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Presupuesto contrapiso</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="js/guard.js"></script>
  <script type="module" src="js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
</head>

<body>
  <div id="navbar"></div>
  <div class="bg-zinc-900 text-slate-100 font-sans min-h-screen py-10 px-4 sm:px-8 flex flex-col items-center">
    <div
      class="w-full max-w-xl bg-zinc-800/80 backdrop-blur-sm border border-zinc-700 rounded-2xl shadow-xl p-6 sm:p-8 space-y-6">

      <header class="text-center space-y-2">
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
          <span>Presupuesto contrapiso</span>
        </h1>
        <p class="text-xs text-zinc-400">Calcula materiales, costos y proporciones fácilmente</p>
      </header>

      <!-- Botones de navegación (Se quitó el botón innecesario del rectángulo) -->
      <div class="flex flex-wrap gap-3 justify-center pt-2">
        <button onclick="mostrarProporciones()"
          class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-xl transition-all shadow-md cursor-pointer flex items-center gap-2 text-sm">
          Proporciones Materiales ⚙️
        </button>
        <button onclick="reinicio()"
          class="bg-zinc-700 hover:bg-zinc-600 text-zinc-200 font-medium px-4 py-2 rounded-xl transition-all shadow-md cursor-pointer text-sm">
          Reiniciar
        </button>
      </div>

      <!-- interfaz_rectángulo (Siempre desplegado por defecto) -->
      <div id="form_rectangulo" class="formulario block space-y-6">
        <form onsubmit="calc_cuadrado_rectangulo(); return false" class="space-y-4">

          <div class="bg-zinc-900/50 p-4 rounded-xl border border-zinc-700/60 space-y-3">
            <h3 class="text-sm font-semibold text-indigo-400 uppercase tracking-wider">Calculo contrapiso de forma
              Cuadrada o Rectángular</h3>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div>
                <label class="block text-xs text-zinc-400 mb-1">Largo (m)</label>
                <input type="number" id="largo" step="any" required
                  class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </div>
              <div>
                <label class="block text-xs text-zinc-400 mb-1">Ancho (m)</label>
                <input type="number" id="ancho" step="any" required
                  class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </div>
              <div>
                <label class="block text-xs text-zinc-400 mb-1">Profundidad (cm)</label>
                <input type="number" id="altura" step="any" required
                  class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </div>
            </div>
          </div>

          <div class="bg-zinc-900/50 p-4 rounded-xl border border-zinc-700/60 space-y-3">
            <h3 class="text-sm font-semibold text-indigo-400 uppercase tracking-wider">Costo de los materiales
              (opcionales)</h3>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div>
                <label class="block text-xs text-zinc-400 mb-1">Precio m³ arena</label>
                <input type="number" id="precio_arena" step="any"
                  class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </div>
              <div>
                <label class="block text-xs text-zinc-400 mb-1">Precio m³ ripio</label>
                <input type="number" id="precio_ripio" step="any"
                  class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </div>
              <div>
                <label class="block text-xs text-zinc-400 mb-1">Precio bolsa cemento</label>
                <input type="number" id="precio_cemento" step="any"
                  class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </div>
            </div>
          </div>

          <button type="submit"
            class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl transition-all shadow-lg cursor-pointer">
            Calcular Presupuesto
          </button>
        </form>

       

      <!-- formulario proporciones materiales (Oculto por defecto, se despliega con el botón) -->
      <div id="form_proporciones"
        class="formulario max-h-0 overflow-hidden opacity-0 transition-all duration-500 ease-in-out space-y-4 bg-zinc-900/50 p-4 rounded-xl border border-zinc-700/60">
        <div>
          <label class="block text-xs text-zinc-400 mb-1">Presupuesto inicial</label>
          <input type="number" id="Presupuesto_2" placeholder="(opcional)"
            class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <h3 class="text-sm font-semibold text-indigo-400 uppercase tracking-wider pt-2">Proporción de mezcla (baldes de
          7
          litros) (modificable)</h3>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs text-zinc-400 mb-1">Arena</label>
            <input type="number" id="prop_arena" value="3"
              class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1">Ripio</label>
            <input type="number" id="prop_ripio" value="3"
              class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1">Cemento</label>
            <input type="number" id="prop_cemento" value="1"
              class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>
      </div>


       <div id="resultado_1"
          class="mt-4 empty:hidden bg-zinc-900/80 border border-zinc-700 p-4 rounded-xl space-y-1 text-sm"></div>
      </div>

    </div>
  </div>
  <script>
    const cantidad_baldes_mcubi = { "arena": 145, "ripio": 140, "cemento": 143 }
    const proporciones_mezcla = { "arena": 3, "ripio": 3, "cemento": 1 }
    const VOLUMEN_BOLSA_CEMENTO = 0.0398


    function calcularMateriales(volumen, proporciones, precios) {
      const sumaPartes = proporciones.arena + proporciones.ripio + proporciones.cemento;

      const volumenes = {
        arena: (proporciones.arena / sumaPartes) * volumen,
        ripio: (proporciones.ripio / sumaPartes) * volumen,
        cemento: (proporciones.cemento / sumaPartes) * volumen
      };

      const baldes = {
        arena: volumenes.arena,
        ripio: volumenes.ripio,
        cemento: Math.ceil(volumenes.cemento / VOLUMEN_BOLSA_CEMENTO)
      };

      const costos = {
        arena: volumenes.arena * precios.arena,
        ripio: volumenes.ripio * precios.ripio,
        cemento: baldes.cemento * precios.cemento
      };

      const total = costos.arena + costos.ripio + costos.cemento;

      return { volumenes, baldes, costos, total };
    }

    function calc_cuadrado_rectangulo() {
      let largo = Number(document.getElementById("largo").value);
      let ancho = Number(document.getElementById("ancho").value);
      let profundidad = Number(document.getElementById("altura").value) / 100;
      let presupuesto = Number(document.getElementById("Presupuesto_2").value) || 0;

      let area = largo * ancho;
      let volumen = area * profundidad;

      const proporciones = {
        arena: Number(document.getElementById("prop_arena").value),
        ripio: Number(document.getElementById("prop_ripio").value),
        cemento: Number(document.getElementById("prop_cemento").value)
      };

      const precios = {
        arena: Number(document.getElementById("precio_arena").value),
        ripio: Number(document.getElementById("precio_ripio").value),
        cemento: Number(document.getElementById("precio_cemento").value)
      };

      const resultado = calcularMateriales(volumen, proporciones, precios);
      const diferencia = presupuesto ? presupuesto - resultado.total : null;

      document.getElementById("resultado_1").innerHTML = `
        <div class="grid grid-cols-2 gap-2 text-zinc-300">
          <div><span class="text-zinc-500">Área:</span> ${area.toFixed(2)} m²</div>
          <div><span class="text-zinc-500">Volumen:</span> ${volumen.toFixed(2)} m³</div>
          <div><span class="text-zinc-500">Arena:</span> ${resultado.volumenes.arena.toFixed(2)} m³</div>
          <div><span class="text-zinc-500">Ripio:</span> ${resultado.volumenes.ripio.toFixed(2)} m³</div>
          <div><span class="text-zinc-500">Cemento:</span> ${resultado.baldes.cemento} bolsas</div>
          <div class="col-span-2 font-semibold text-emerald-400 pt-2 border-t border-zinc-700">Costo total: $${resultado.total.toFixed(2)}</div>
        </div>
        ${presupuesto ? `<div class="mt-2 pt-2 border-t border-zinc-700 text-xs"><span class="text-zinc-500">Presupuesto:</span> $${presupuesto.toFixed(2)}<br><span class="${diferencia >= 0 ? "text-emerald-400" : "text-rose-400"} font-semibold">${diferencia >= 0 ? "Sobra" : "Falta"}: $${Math.abs(diferencia).toFixed(2)}</span></div>` : ""}
      `;
    }

    function mostrarProporciones() {
      const propDiv = document.getElementById("form_proporciones");
      if (propDiv.classList.contains("max-h-0")) {
        propDiv.classList.remove("max-h-0", "opacity-0");
        propDiv.classList.add("max-h-[1000px]", "opacity-100");
      } else {
        propDiv.classList.add("max-h-0", "opacity-0");
        propDiv.classList.remove("max-h-[1000px]", "opacity-100");
      }
    }

    function reinicio() {
      document.getElementById("form_rectangulo").querySelector("form").reset();
      document.getElementById("form_proporciones").querySelector("input#Presupuesto_2").value = "";
      document.getElementById("form_proporciones").querySelector("input#prop_arena").value = "3";
      document.getElementById("form_proporciones").querySelector("input#prop_ripio").value = "3";
      document.getElementById("form_proporciones").querySelector("input#prop_cemento").value = "1";
      document.getElementById("form_proporciones").classList.add("max-h-0", "opacity-0");
      document.getElementById("form_proporciones").classList.remove("max-h-[1000px]", "opacity-100");
      document.getElementById("resultado_1").innerHTML = "";
    }
  </script>
  <script type="module" src="js/navbar.js"></script>
</body>

</html>
